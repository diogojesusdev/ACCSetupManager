<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACC Setup Manager</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(188, 54, 36, 0.06) 0,
            rgba(188, 54, 36, 0.06) 2px,
            transparent 2px,
            transparent 18px
          ),
          linear-gradient(180deg, rgba(20, 22, 24, 0.98) 0%, rgba(10, 11, 12, 1) 100%);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: transparent;
        color: #f3efe6;
      }

      #root {
        min-height: 100vh;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(188, 54, 36, 0.06) 0,
            rgba(188, 54, 36, 0.06) 2px,
            transparent 2px,
            transparent 18px
          ),
          linear-gradient(180deg, rgba(20, 22, 24, 0.98) 0%, rgba(10, 11, 12, 1) 100%);
        z-index: 9999;
        transition: opacity 140ms ease;
      }

      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-header {
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 0.75rem;
        background: rgba(12, 14, 16, 0.96);
        border-bottom: 1px solid rgba(188, 54, 36, 0.28);
      }

      .boot-title {
        font-size: 0.875rem;
        font-weight: 700;
      }

      .boot-subtitle {
        margin-top: 0.1rem;
        font-size: 0.75rem;
        color: rgba(243, 239, 230, 0.68);
      }

      .boot-main {
        flex: 1;
        padding: 0.5rem;
      }

      .boot-card {
        height: 100%;
        padding: 0.5rem;
        border: 1px solid rgba(188, 54, 36, 0.2);
        border-radius: 0.75rem;
        background: rgba(14, 16, 18, 0.96);
      }

      .boot-panel-title {
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .boot-grid {
        display: grid;
        grid-template-columns: minmax(14rem, 16rem) minmax(14rem, 17rem) minmax(0, 1fr);
        gap: 0.5rem;
        height: calc(100vh - 120px);
      }

      .boot-column {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0;
      }

      .boot-list-shell {
        flex: 1;
        padding: 0.35rem;
        border: 1px solid rgba(214, 220, 226, 0.08);
        border-radius: 0.4rem;
        background: rgba(8, 9, 11, 0.92);
      }

      .boot-skeleton,
      .boot-skeleton-small,
      .boot-skeleton-pill {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.06) 25%,
          rgba(255, 255, 255, 0.12) 37%,
          rgba(255, 255, 255, 0.06) 63%
        );
        background-size: 400% 100%;
        animation: boot-shimmer 1.1s ease-in-out infinite;
        border-radius: 0.4rem;
      }

      .boot-skeleton-small {
        height: 22px;
      }

      .boot-skeleton-pill {
        height: 34px;
      }

      .boot-skeleton {
        height: 44px;
        margin-top: 0.5rem;
      }

      .boot-skeleton:first-child {
        margin-top: 0;
      }

      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-header">
        <div>
          <div class="boot-title">ACC Setup Manager</div>
          <div class="boot-subtitle">Loading your setup library</div>
        </div>
      </div>
      <div class="boot-main">
        <div class="boot-card">
          <div class="boot-panel-title">Setup library</div>
          <div class="boot-grid">
            <div class="boot-column">
              <div class="boot-skeleton-small"></div>
              <div class="boot-list-shell">
                <div class="boot-skeleton"></div>
                <div class="boot-skeleton"></div>
                <div class="boot-skeleton"></div>
              </div>
            </div>
            <div class="boot-column">
              <div class="boot-skeleton-small"></div>
              <div class="boot-list-shell">
                <div class="boot-skeleton"></div>
                <div class="boot-skeleton"></div>
                <div class="boot-skeleton"></div>
              </div>
            </div>
            <div class="boot-column">
              <div class="boot-skeleton-pill"></div>
              <div class="boot-list-shell">
                <div class="boot-skeleton" style="height: 56px"></div>
                <div class="boot-skeleton"></div>
                <div class="boot-skeleton"></div>
                <div class="boot-skeleton"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
