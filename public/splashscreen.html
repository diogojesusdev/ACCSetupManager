<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACC Setup Manager</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(188, 54, 36, 0.14), transparent 46%),
          linear-gradient(180deg, #141618 0%, #0a0b0c 100%);
        color: #f3efe6;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash-card {
        width: min(32rem, calc(100vw - 2rem));
        padding: 1.2rem 1.25rem;
        border: 1px solid rgba(188, 54, 36, 0.24);
        border-radius: 1rem;
        background: rgba(14, 16, 18, 0.96);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      .eyebrow {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(243, 239, 230, 0.72);
      }

      h1 {
        margin: 0.4rem 0 0;
        font-size: 1.6rem;
        font-family:
          Bahnschrift, "Arial Narrow", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      p {
        margin: 0.4rem 0 0;
        font-size: 1rem;
        color: rgba(243, 239, 230, 0.78);
      }

      .bar {
        height: 0.4rem;
        margin-top: 1rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .bar::after {
        content: "";
        display: block;
        width: 48%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(188, 54, 36, 0.9), rgba(242, 116, 72, 0.9));
      }
    </style>
  </head>
  <body>
    <main class="splash-card" aria-live="polite">
      <div class="eyebrow">ACC Setup Manager</div>
      <h1>Opening your setup library</h1>
      <p>Starting the app shell and preparing the browser view.</p>
      <div class="bar"></div>
    </main>
  </body>
</html>
