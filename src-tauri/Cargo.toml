[package]
name = "app"
version = "0.1.0"
description = "Windows desktop app for browsing, editing, and organizing Assetto Corsa Competizione setup files"
authors = ["Diogo Jesus"]
license = "MIT"
repository = "https://github.com/diogojesusdev/ACCSetupManager"
homepage = "https://diogojesusdev.github.io/ACCSetupManager/"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
notify = "8"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
thiserror = "2.0"
trash = "5.2"
uuid = { version = "1.18", features = ["v4"] }
